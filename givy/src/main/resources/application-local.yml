spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/givy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PWD} # 각자 로컬 DB 비번 사용
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

  jwt:
    secret: ${JWT_SECRET:local_test_secret_key_1234567890}
    expiration-ms: 3600000